name: Angular + Express via Docker Compose

on:
  push:
    branches:
      - aws
  workflow_dispatch:

# permission can be added at job level or workflow level: testing
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug OIDC Token Claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=://amazonaws.com" | jq -r '.value')
          echo $TOKEN | cut -d '.' -f 2 | base64 -d 2>/dev/null | jq '{sub, aud, iss}'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          BACKEND_REPO: ${{ secrets.ECR_BACKEND_REPO }}
          PORT: ${{ secrets.PORT }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLIENT_ORIGIN: ${{ secrets.CLIENT_ORIGIN }}
          UPLOAD_DIR: ${{ secrets.UPLOAD_DIR }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_TOKEN_SECRET: ${{ secrets.ADMIN_TOKEN_SECRET }}
        run: |
          docker build -t ${{ secrets.ECR_BACKEND_REPO }}:latest ./server
          docker push ${{ secrets.ECR_BACKEND_REPO }}:latest

      - name: Build and push frontend image
        env:
          FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
        run: |
          docker build -t ${{ secrets.ECR_FRONTEND_REPO }}:latest ./client
          docker push ${{ secrets.ECR_FRONTEND_REPO }}:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${{ secrets.ECR_BACKEND_REPO }}
            BACKEND_REPO=${{ secrets.ECR_BACKEND_REPO }} FRONTEND_REPO=${{ secrets.ECR_FRONTEND_REPO }} docker compose pull
            BACKEND_REPO=${{ secrets.ECR_BACKEND_REPO }} FRONTEND_REPO=${{ secrets.ECR_FRONTEND_REPO }} docker compose up -d

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/app"

      - name: Pull and restart containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
            export FRONTEND_REPO=${{ secrets.ECR_FRONTEND_REPO }}
            export BACKEND_REPO=${{ secrets.ECR_BACKEND_REPO }}
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
